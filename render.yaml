services:
  - type: web
    name: proclubshq
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run render:build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DISABLE_DATABASE
        value: true
      - key: EA_API_BASE_URL
        value: https://proclubs.ea.com/api/fc
      - key: EA_PLATFORM
        value: common-gen5
